[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "digitaltwin-mp"
version = "0.1.0"
description = "AI-Driven Digital Twin Framework for Predictive Cyber Defense in Educational Institutions"
authors = [
    { name = "Abhishek Yadav" },
    { name = "Tanmay Kumar" },
    { name = "Atharva Chaprana" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.3",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.35",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
